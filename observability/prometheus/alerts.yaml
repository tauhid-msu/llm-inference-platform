groups:
  - name: llm-gateway
    rules:
      - alert: LLMGatewayHighErrorRate
        expr: |
          sum(rate(llm_gateway_requests_total{status!="ok"}[5m]))
          /
          clamp_min(sum(rate(llm_gateway_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "LLM gateway error rate is above 5%"
          description: "Investigate backend availability, prompt rejections, and recent deploys."
      - alert: LLMGatewayHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(llm_gateway_request_duration_seconds_bucket[5m])) by (le, model)
          ) > 5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "LLM gateway p95 latency is above 5 seconds"
          description: "Check queueing, backend saturation, and token volume for model {{ $labels.model }}."
